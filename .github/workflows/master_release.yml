name: "master release"
on:
  push:
    paths:
      - "config/**"
    branches:
      - "master"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main # zizmor: ignore[unpinned-uses]
  release:
    name: "Release"
    permissions:
      contents: write
    runs-on: "ubuntu-latest"
    needs: build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware
          path: build/artifacts
      - name: Create Release
        run: |
          gh release create --generate-notes --prerelease latest_dev --title "Latest dev build" build/artifacts/*.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
